<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fluoroscopy to Cine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&amp;display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fff;
        color: #4a4a4a;
        font-family: "Jost", sans-serif;
        font-weight: 400;
      }

      .project-header {
        max-width: 940px;
        margin: 0 auto;
        padding: 31px 15px;
        text-align: center;
      }

      .project-title {
        margin: 0;
        color: #363636;
        font-size: 48px;
        font-weight: 500;
        line-height: 1.125;
        letter-spacing: normal;
        text-wrap: balance;
      }

      .project-subtitle {
        margin: 0 0 29px;
        color: #363636;
        /* NeRF subtitle: 20px. Increase its font size by 20%. */
        font-size: 24px;
        font-weight: 400;
        line-height: 44px;
        letter-spacing: 0;
        text-wrap: balance;
      }

      .nowrap {
        white-space: nowrap;
      }

      .author-divider {
        max-width: 820px;
        margin: 28px auto;
        border: 0;
        border-top: 1px solid #d6d6d6;
      }

      .team-details {
        color: #4a4a4a;
      }

      .team-name {
        margin: 0 0 12px;
        color: #363636;
        font-size: 24px;
        font-weight: 500;
        line-height: 1.5;
        text-wrap: balance;
      }

      .team-details sup {
        font-size: 0.7em;
        line-height: 0;
      }

      .team-affiliations {
        margin-bottom: 0;
        font-size: 16px;
        line-height: 1.7;
        text-wrap: balance;
      }

      .team-affiliations p {
        margin: 0;
      }

      .contributors {
        max-width: 820px;
        margin: 0 auto;
        color: #4a4a4a;
        font-size: 16px;
        line-height: 1.7;
      }

      .contributor {
        color: hsl(204, 86%, 53%);
        text-decoration: none;
        text-underline-offset: 3px;
        white-space: nowrap;
      }

      .contributor:hover {
        text-decoration: underline;
      }

      .contributor:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
      }

      .project-demos {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
        width: calc(100% - 30px);
        max-width: 1048px;
        margin: 0 auto 48px;
      }

      .project-demo {
        min-width: 0;
        margin: 0;
      }

      .demo-video {
        display: block;
        width: 100%;
        height: auto;
        background: #000;
      }

      .project-demo figcaption {
        margin-top: 12px;
        color: #4a4a4a;
        font-size: 20px;
        line-height: 1.5;
        text-align: center;
      }

      .degradation-figure {
        width: calc(100% - 30px);
        max-width: 1048px;
        margin: 0 auto 64px;
      }

      .degradation-figure img {
        display: block;
        width: 100%;
        height: auto;
      }

      .degradation-figure figcaption {
        margin-top: 16px;
        color: #4a4a4a;
        font-size: 16px;
        line-height: 1.7;
        text-align: left;
      }

      @media (max-width: 639px) {
        .project-demos {
          grid-template-columns: 1fr;
          max-width: 512px;
          gap: 28px;
        }
      }

      @media (max-width: 991px) {
        .project-header {
          max-width: 728px;
        }

        .project-subtitle {
          margin-bottom: 9px;
        }
      }

      @media (max-width: 767px) {
        .project-header {
          padding-top: 10px;
        }

        .project-title {
          margin-bottom: 1px;
          font-size: clamp(30px, 6vw, 48px);
          line-height: 1.3;
        }

        .project-subtitle {
          margin-bottom: 7px;
          /* NeRF subtitle: 3vw. */
          font-size: 3.6vw;
          line-height: 4.8vw;
        }
      }

      @media (max-width: 479px) {
        .project-subtitle {
          margin-bottom: 10px;
          /* NeRF subtitle: 4vw. */
          font-size: 4.8vw;
          line-height: 6vw;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="project-header">
        <h1 class="project-title">Fluoroscopy to Cine</h1>
        <p class="project-subtitle">Generative Restoration for <span class="nowrap">Low-dose</span> Coronary Angiography</p>
        <hr class="author-divider">
        <section class="team-details" aria-labelledby="team-name">
          <h2 class="team-name" id="team-name">SNUBH Coronary Artery AI Team<sup>1,2</sup></h2>
          <div class="team-affiliations">
            <p><sup>1</sup>Cardiovascular Center, Seoul National University Bundang Hospital, Korea</p>
            <p><sup>2</sup>Seoul National University, Korea</p>
          </div>
          <p class="contributors">
            Contacts: <a class="contributor" href="mailto:highsg19101@gmail.com">Sang-Kyun Ko</a>,
            <a class="contributor" href="mailto:eandp303@gmail.com">Si-Hyuck Kang*</a>
          </p>
        </section>
      </header>
      <section class="project-demos" aria-label="Project phases">
        <figure class="project-demo">
          <video class="demo-video" autoplay muted loop playsinline preload="auto"
            width="512" height="512" poster="assets/videos/phase-1-degradation-poster.jpg"
            aria-labelledby="phase-1-caption">
            <source src="assets/videos/phase-1-degradation.mp4" type="video/mp4">
            Your browser does not support embedded video.
            <a href="assets/videos/phase-1-degradation.mp4">Download the degradation video</a>.
          </video>
          <figcaption id="phase-1-caption">Phase 1 - Degradation</figcaption>
        </figure>
        <figure class="project-demo">
          <video class="demo-video" autoplay muted loop playsinline preload="auto"
            width="512" height="512" poster="assets/videos/phase-2-restoration-poster.jpg"
            aria-labelledby="phase-2-caption">
            <source src="assets/videos/phase-2-restoration.mp4" type="video/mp4">
            Your browser does not support embedded video.
            <a href="assets/videos/phase-2-restoration.mp4">Download the restoration video</a>.
          </video>
          <figcaption id="phase-2-caption">Phase 2- Restoration</figcaption>
        </figure>
      </section>
      <figure class="degradation-figure">
        <a href="assets/images/degradation-grid-from-original-cine-kvp-plus10-mas-minus2.png" target="_blank" rel="noopener">
          <img src="assets/images/degradation-grid-from-original-cine-kvp-plus10-mas-minus2.png"
            width="2200" height="2280" loading="lazy" decoding="async"
            alt="Original cine frame and eight synthetic fluoroscopy settings arranged in a three-by-three grid. Open the full-resolution image."
            aria-describedby="degradation-caption">
        </a>
        <figcaption id="degradation-caption">Controllable degradation of a cine frame by target tube voltage and exposure. The original cine frame (bottom right; 76.14 kVp, 4.23 mAs/frame) is converted to synthetic fluoroscopy at eight target settings. Each step up lowers the mAs by 2 at a fixed kVp, and each step left raises the kVp by 10 at a fixed mAs. Noise is strongest at the lowest dose (top right) and weakens as the kVp or mAs increases, while the mean brightness is preserved. All panels show the same frame in the same grey window (0–255)</figcaption>
      </figure>
    </main>
  </body>
</html>
