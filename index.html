<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fluoroscopy to Cine (F2C)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@500&family=Varela+Round&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fff;
      }

      .project-header {
        max-width: 940px;
        margin: 0 auto;
        padding: 31px 15px;
        text-align: center;
      }

      .project-title {
        margin: 0;
        color: #4d4d4d;
        font-family: "Varela Round", sans-serif;
        font-size: 50px;
        font-weight: 700;
        line-height: 65px;
        letter-spacing: 4px;
        text-wrap: balance;
      }

      .project-subtitle {
        margin: 0 0 29px;
        color: #333;
        font-family: "Open Sans", sans-serif;
        /* NeRF subtitle: 20px. Increase its font size by 20%. */
        font-size: 24px;
        font-weight: 500;
        line-height: 44px;
        letter-spacing: 0;
        text-wrap: balance;
      }

      .nowrap {
        white-space: nowrap;
      }

      @media (max-width: 991px) {
        .project-header {
          max-width: 728px;
        }

        .project-subtitle {
          margin-bottom: 9px;
        }
      }

      @media (max-width: 767px) {
        .project-header {
          padding-top: 10px;
        }

        .project-title {
          margin-bottom: 1px;
          font-size: clamp(30px, 6vw, 50px);
          line-height: 1.3;
          letter-spacing: 2px;
        }

        .project-subtitle {
          margin-bottom: 7px;
          /* NeRF subtitle: 3vw. */
          font-size: 3.6vw;
          line-height: 4.8vw;
        }
      }

      @media (max-width: 479px) {
        .project-title {
          letter-spacing: 1px;
        }

        .project-subtitle {
          margin-bottom: 10px;
          /* NeRF subtitle: 4vw. */
          font-size: 4.8vw;
          line-height: 6vw;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="project-header">
        <h1 class="project-title">Fluoroscopy to Cine (F2C)</h1>
        <p class="project-subtitle">Generative Restoration for <span class="nowrap">Low-dose</span> Coronary Angiography</p>
      </header>
    </main>
  </body>
</html>
