<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fluoroscopy to Cine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&amp;display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fff;
        font-family: "Nanum Myeongjo", serif;
      }

      .project-header {
        max-width: 940px;
        margin: 0 auto;
        padding: 31px 15px;
        text-align: center;
      }

      .project-title {
        margin: 0;
        color: #000;
        font-size: 50px;
        font-weight: 400;
        line-height: 65px;
        letter-spacing: 4px;
        text-wrap: balance;
      }

      .project-subtitle {
        margin: 0 0 29px;
        color: #333;
        /* NeRF subtitle: 20px. Increase its font size by 20%. */
        font-size: 24px;
        font-weight: 400;
        line-height: 44px;
        letter-spacing: 0;
        text-wrap: balance;
      }

      .nowrap {
        white-space: nowrap;
      }

      .author-divider {
        max-width: 820px;
        margin: 28px auto;
        border: 0;
        border-top: 1px solid #d6d6d6;
      }

      .team-details {
        color: #000;
      }

      .team-name {
        margin: 0 0 12px;
        font-size: 24px;
        font-weight: 400;
        line-height: 1.5;
        text-wrap: balance;
      }

      .team-details sup {
        font-size: 0.7em;
        line-height: 0;
      }

      .team-affiliations {
        margin-bottom: 0;
        font-size: 16px;
        font-style: italic;
        line-height: 1.7;
        text-wrap: balance;
      }

      .team-affiliations p {
        margin: 0;
      }

      .contributors {
        max-width: 820px;
        margin: 0 auto;
        color: #000;
        font-size: 16px;
        line-height: 1.7;
      }

      .contributor {
        color: #3d737f;
        text-decoration: underline;
        text-underline-offset: 3px;
        white-space: nowrap;
      }

      .contributor:hover {
        color: #234852;
      }

      .contributor:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
      }

      @media (max-width: 991px) {
        .project-header {
          max-width: 728px;
        }

        .project-subtitle {
          margin-bottom: 9px;
        }
      }

      @media (max-width: 767px) {
        .project-header {
          padding-top: 10px;
        }

        .project-title {
          margin-bottom: 1px;
          font-size: clamp(30px, 6vw, 50px);
          line-height: 1.3;
          letter-spacing: 2px;
        }

        .project-subtitle {
          margin-bottom: 7px;
          /* NeRF subtitle: 3vw. */
          font-size: 3.6vw;
          line-height: 4.8vw;
        }
      }

      @media (max-width: 479px) {
        .project-title {
          letter-spacing: 1px;
        }

        .project-subtitle {
          margin-bottom: 10px;
          /* NeRF subtitle: 4vw. */
          font-size: 4.8vw;
          line-height: 6vw;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="project-header">
        <h1 class="project-title">Fluoroscopy to Cine</h1>
        <p class="project-subtitle">Generative Restoration for <span class="nowrap">Low-dose</span> Coronary Angiography</p>
        <hr class="author-divider">
        <section class="team-details" aria-labelledby="team-name">
          <h2 class="team-name" id="team-name">SNUBH Coronary Artery AI Team<sup>1,2</sup></h2>
          <div class="team-affiliations">
            <p><sup>1</sup>Cardiovascular Center, Seoul National University Bundang Hospital, Korea</p>
            <p><sup>2</sup>Seoul National University, Korea</p>
          </div>
          <p class="contributors">
            Contacts: <a class="contributor" href="mailto:highsg19101@gmail.com"><strong>Sang-Kyun Ko</strong></a>,
            <a class="contributor" href="mailto:eandp303@gmail.com"><strong>Si-Hyuck Kang*</strong></a>
          </p>
        </section>
      </header>
    </main>
  </body>
</html>
